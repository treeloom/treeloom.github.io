<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treeloom is now Treeweft</title>
<meta name="description" content="Treeloom is now Treeweft. Development continues at github.com/treeweft/treeweft." />
<link rel="icon" type="image/svg+xml" href="assets/branding/treeloom-favicon.svg" />
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --accent: #1a7f37; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --accent: #3fb950; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--fg); font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 36rem; }
  h1 { font-size: 2rem; margin: 0 0 0.5rem; }
  p { margin: 0.5rem 0; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Treeloom is now Treeweft</h1>
  <p>This project is archived and no longer maintained.</p>
  <p>Development continues at <a href="https://github.com/treeweft/treeweft">github.com/treeweft/treeweft</a>.</p>
</main>
</body>
</html>
